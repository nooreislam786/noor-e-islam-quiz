v<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noor-e-Islam Quiz</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f2f7f4;
  color:#173b2b;
}
.container{
  max-width:600px;
  margin:auto;
  padding:20px;
}
.card{
  background:white;
  border-radius:18px;
  padding:25px;
  margin-top:25px;
  box-shadow:0 5px 20px #0002;
}
h1{
  text-align:center;
  margin-bottom:5px;
}
.subtitle{
  text-align:center;
  color:#667;
}
.question{
  font-size:21px;
  font-weight:bold;
  margin:25px 0 18px;
}
.option{
  display:block;
  width:100%;
  padding:14px;
  margin:10px 0;
  border:2px solid #d8e5dd;
  border-radius:12px;
  background:white;
  font-size:16px;
  text-align:left;
}
.option:hover{
  background:#e8f5ed;
}
button{
  cursor:pointer;
}
#next{
  width:100%;
  padding:15px;
  margin-top:15px;
  border:0;
  border-radius:12px;
  background:#16834b;
  color:white;
  font-size:18px;
}
#result{
  text-align:center;
  display:none;
}
.score{
  font-size:30px;
  font-weight:bold;
  color:#16834b;
}
</style>
</head>

<body>

<div class="container">
  <div class="card">

    <h1>🌙 Noor-e-Islam Quiz</h1>
    <p class="subtitle">Apne Islami ilm ko test karein</p>

    <div id="quiz"></div>

    <button id="next" onclick="nextQuestion()">Agla Sawal</button>

    <div id="result">
      <h2>🎉 Quiz Mukammal!</h2>
      <p class="score" id="score"></p>
      <button id="next" onclick="location.reload()">Dobara Quiz Karein</button>
    </div>

  </div>
</div>

<script>
const questions = [
  {
    q:"Islam ke kitne Arkaan hain?",
    options:["3","4","5","6"],
    answer:2
  },
  {
    q:"Quran Majeed kis mahine mein nazil hona shuru hua?",
    options:["Muharram","Ramadan","Shawwal","Rajab"],
    answer:1
  },
  {
    q:"Muslim din mein kitni farz namazein ada karte hain?",
    options:["3","4","5","6"],
    answer:2
  },
  {
    q:"Quran Majeed mein kitni Suratein hain?",
    options:["110","112","114","116"],
    answer:2
  },
  {
    q:"Islam ke aakhri Nabi kaun hain?",
    options:["Hazrat Musa (A.S.)","Hazrat Isa (A.S.)","Hazrat Ibrahim (A.S.)","Hazrat Muhammad ﷺ"],
    answer:3
  }, 
  {
    q:"Quran Majeed kis mahine mein nazil hua?",
    options:["Ramadan","Shawwal","Muharram","Rajab"],
    answer:0
}
];

let current = 0;
let score = 0;
let selected = false;

function showQuestion(){
  selected = false;

  const q = questions[current];

  let html =
    "<div class='question'>" +
    (current + 1) + ". " + q.q +
    "</div>";

  q.options.forEach((option,index)=>{
    html +=
      "<button class='option' onclick='selectAnswer("+index+")'>" +
      option +
      "</button>";
  });

  document.getElementById("quiz").innerHTML = html;
}

function selectAnswer(index){
  if(selected) return;

  selected = true;

  if(index === questions[current].answer){
    score++;
    event.target.style.background = "#c9f2d9";
    event.target.style.borderColor = "#16834b";
  }else{
    event.target.style.background = "#ffd6d6";
    event.target.style.borderColor = "#d33";
  }
}

function nextQuestion(){
  if(!selected){
    alert("Pehle ek jawab select karein.");
    return;
  }

  current++;

  if(current < questions.length){
    showQuestion();
  }else{
    document.getElementById("quiz").style.display = "none";
    document.getElementById("next").style.display = "none";
    document.getElementById("result").style.display = "block";

    document.getElementById("score").innerText =
      score + " / " + questions.length + " sahi jawab";
  }
}

showQuestion();
</script>

</body>
</html>
