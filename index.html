<head>

<meta name="google-adsense-account" content="ca-pub-8642237040031125">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8642237040031125"
crossorigin="anonymous"></script>
     
<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f2f7f4;
  color:#173b2b;
}
.container{
  max-width:600px;
  margin:auto;
  padding:20px;
}
.card{
  background:white;
  border-radius:18px;
  padding:25px;
  margin-top:25px;
  box-shadow:0 5px 20px #0002;
}
h1{
  text-align:center;
  margin-bottom:5px;
}
.subtitle{
  text-align:center;
  color:#667;
}
.question{
  font-size:21px;
  font-weight:bold;
  margin:25px 0 18px;
}
.option{
  display:block;
  width:100%;
  padding:14px;
  margin:10px 0;
  border:2px solid #d8e5dd;
  border-radius:12px;
  background:white;
  font-size:16px;
  text-align:left;
}
.option:hover{
  background:#e8f5ed;
}
button{
  cursor:pointer;
}
#next{
  width:100%;
  padding:15px;
  margin-top:15px;
  border:0;
  border-radius:12px;
  background:#16834b;
  color:white;
  font-size:18px;
}
#result{
  text-align:center;
  display:none;
}
.score{
  font-size:30px;
  font-weight:bold;
  color:#16834b;
}
#restart,#share{
  width:100%;
  padding:15px;
  margin-top:12px;
  border:0;
  border-radius:12px;
  color:white;
  font-size:18px;
}
#restart{
  background:#16834b;
}
#share{
  background:#25D366;
}
</style>
</head>

<body>

<div class="container">
<div class="card">

<h1>🌙 Noor-e-Islam Quiz</h1>

<p class="subtitle">
Apne Islami ilm ko test karein
</p>

<div id="quiz"></div>

<button id="next" onclick="nextQuestion()">
Agla Sawal
</button>

<div id="result">

<h2>🎉 Quiz Mukammal!</h2>

<p class="score" id="score"></p>

<button id="restart" onclick="location.reload()">
Dobara Quiz Karein
</button>

<button id="share" onclick="shareWhatsApp()">
📲 WhatsApp par Share Karein
</button>

</div>

</div>
</div>

<script>

const questions = [

{
q:"Islam ke kitne Arkaan hain?",
options:["3","4","5","6"],
answer:2
},

{
q:"Quran Majeed kis mahine mein nazil hona shuru hua?",
options:["Muharram","Ramadan","Shawwal","Rajab"],
answer:1
},

{
q:"Muslim din mein kitni farz namazein ada karte hain?",
options:["3","4","5","6"],
answer:2
},

{
q:"Quran Majeed mein kitni Suratein hain?",
options:["110","112","114","116"],
answer:2
},

{
q:"Islam ke aakhri Nabi kaun hain?",
options:[
"Hazrat Musa (A.S.)",
"Hazrat Isa (A.S.)",
"Hazrat Ibrahim (A.S.)",
"Hazrat Muhammad ﷺ"
],
answer:3
},

{
q:"Quran Majeed kis mahine mein nazil hua?",
options:["Ramadan","Shawwal","Muharram","Rajab"],
answer:0
},
  { q:"Islam mein kitne Farz namaz hain?",
options:["3","5","7","10"],
answer:1
},
{
 q:"Zakat Islam ka kaunsa Rukn hai?",
options:["Pehla","Doosra","Teesra","Chautha"],
answer:2
},

{
q:"Hajj kis Islami mahine mein hota hai?",
options:["Ramadan","Muharram","Dhul-Hijjah","Rajab"],
answer:2
},

{
q:"Islam ki pehli Masjid ka naam kya hai?",
options:["Masjid an-Nabawi","Masjid al-Haram","Masjid Quba","Masjid al-Aqsa"],
answer:2
},

{
q:"Kaaba Sharif kis shehar mein hai?",
options:["Madinah","Makkah","Taif","Jeddah"],
answer:1
},

{
q:"Hazrat Muhammad ﷺ par pehli wahi kis jagah nazil hui?",
options:["Ghar-e-Hira","Ghar-e-Saur","Masjid Quba","Madinah"],
answer:0
},

{
q:"Islam ke pehle Khalifa kaun the?",
options:["Hazrat Umar (R.A.)","Hazrat Ali (R.A.)","Hazrat Abu Bakr (R.A.)","Hazrat Usman (R.A.)"],
answer:2
},

{
q:"Namaz mein qibla kis taraf hota hai?",
options:["Masjid al-Aqsa","Kaaba Sharif","Madinah","Taif"],
answer:1
},

{
q:"Ramadan ke baad kaunsi Eid aati hai?",
options:["Eid-ul-Adha","Eid-ul-Fitr","Eid Milad","Shab-e-Barat"],
answer:1
},

{
q:"Islam ki paak kitaab ka naam kya hai?",
options:["Torah","Bible","Quran Majeed","Zabur"],
answer:2
},

];

let current = 0;
let score = 0;
let selected = false;

function showQuestion(){

selected = false;

const q = questions[current];

let html =
"<div class='question'>" +
(current + 1) + ". " + q.q +
"</div>";

q.options.forEach((option,index)=>{

html +=
"<button class='option' onclick='selectAnswer(" +
index +
", this)'>" +
option +
"</button>";

});

document.getElementById("quiz").innerHTML = html;

}

function selectAnswer(index, button){

if(selected) return;

selected = true;

if(index === questions[current].answer){

score++;

button.style.background = "#c9f2d9";
button.style.borderColor = "#16834b";

}else{

button.style.background = "#ffd6d6";
button.style.borderColor = "#d33";

}

}

function nextQuestion(){

if(!selected){

alert("Pehle ek jawab select karein.");

return;

}

current++;

if(current < questions.length){

showQuestion();

}else{

document.getElementById("quiz").style.display = "none";

document.getElementById("next").style.display = "none";

document.getElementById("result").style.display = "block";

document.getElementById("score").innerText =
score + " / " + questions.length + " sahi jawab";

}

}

function shareWhatsApp(){

const text =
"🌙 Noor-e-Islam Quiz\n\n" +
"Maine Noor-e-Islam Quiz complete kiya!\n" +
"Mera score: " + score + " / " +
questions.length + " sahi jawab.";

const url =
"https://wa.me/?text=" +
encodeURIComponent(text);

window.open(url,"_blank");

}

showQuestion();

</script>

</footer>
</body>
</html>
